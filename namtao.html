<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เกมน้ำเต้าปูปลา</title>

<style>

body{
font-family:sans-serif;
background:linear-gradient(135deg,#1a1a2e,#16213e);
color:white;
text-align:center;
margin:0;
}

.center{
margin-top:200px;
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:none;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#00d4ff;
color:black;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

header{
display:flex;
justify-content:space-between;
padding:20px;
background:#0f3460;
}

.boardContainer{
display:flex;
justify-content:center;
gap:40px;
margin-top:30px;
flex-wrap:wrap;
}

.board{
background:#0f3460;
padding:20px;
border-radius:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,100px);
gap:10px;
}

.bet{
background:#1f4068;
border-radius:10px;
padding:15px;
font-size:30px;
cursor:pointer;
transition:0.3s;
}

.bet:hover{
transform:scale(1.1);
background:#00d4ff;
color:black;
}

.log{
margin-top:30px;
background:#0f3460;
padding:20px;
height:150px;
overflow:auto;
}

/* dice area */

.diceArea{
margin-top:30px;
padding:20px;
background:#0f3460;
}

.dice{
font-size:60px;
margin:10px;
display:inline-block;
}

/* animation */

.roll{
animation:spin 0.6s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

</style>
</head>

<body>

<div id="loginPage" class="center">
<h1>🎲 น้ำเต้าปูปลา</h1>
<input type="text" id="username" placeholder="Username">
<br>
<button onclick="login()">เข้าสู่เกม</button>
</div>

<div id="gamePage" style="display:none">

<header>
<h2 id="playerName"></h2>
<div>
คะแนน: <span id="points">1000</span>
</div>
</header>

<h2>ผลการทอยลูกเต๋า</h2>

<div class="diceArea">

<div id="dice1" class="dice">🎲</div>
<div id="dice2" class="dice">🎲</div>
<div id="dice3" class="dice">🎲</div>

<br>

<button onclick="rollDice()">ทอยลูกเต๋า</button>

<div id="diceResult"></div>

</div>

<h1>เลือกบอร์ดเดิมพัน</h1>

<div class="boardContainer">

<div class="board">
<h3>บอร์ด 1</h3>
<div class="grid">
<div class="bet" onclick="bet(1,'ปลา')">🐟</div>
<div class="bet" onclick="bet(1,'ปู')">🦀</div>
<div class="bet" onclick="bet(1,'น้ำเต้า')">🍐</div>
<div class="bet" onclick="bet(1,'เสือ')">🐯</div>
<div class="bet" onclick="bet(1,'กุ้ง')">🦐</div>
<div class="bet" onclick="bet(1,'ไก่')">🐔</div>
</div>
</div>

<div class="board">
<h3>บอร์ด 2</h3>
<div class="grid">
<div class="bet" onclick="bet(2,'ปลา')">🐟</div>
<div class="bet" onclick="bet(2,'ปู')">🦀</div>
<div class="bet" onclick="bet(2,'น้ำเต้า')">🍐</div>
<div class="bet" onclick="bet(2,'เสือ')">🐯</div>
<div class="bet" onclick="bet(2,'กุ้ง')">🦐</div>
<div class="bet" onclick="bet(2,'ไก่')">🐔</div>
</div>
</div>

<div class="board">
<h3>บอร์ด 3</h3>
<div class="grid">
<div class="bet" onclick="bet(3,'ปลา')">🐟</div>
<div class="bet" onclick="bet(3,'ปู')">🦀</div>
<div class="bet" onclick="bet(3,'น้ำเต้า')">🍐</div>
<div class="bet" onclick="bet(3,'เสือ')">🐯</div>
<div class="bet" onclick="bet(3,'กุ้ง')">🦐</div>
<div class="bet" onclick="bet(3,'ไก่')">🐔</div>
</div>
</div>

</div>

<h2>ประวัติการเดิมพัน</h2>
<div class="log" id="log"></div>

</div>

<script>

let playerName=""
let points=1000

const items=[
{ name:"ปลา", icon:"🐟"},
{ name:"ปู", icon:"🦀"},
{ name:"น้ำเต้า", icon:"🍐"},
{ name:"เสือ", icon:"🐯"},
{ name:"กุ้ง", icon:"🦐"},
{ name:"ไก่", icon:"🐔"}
]

function login(){

playerName=document.getElementById("username").value

if(playerName===""){
alert("กรอก Username ก่อน")
return
}

document.getElementById("playerName").innerText="ผู้เล่น: "+playerName
document.getElementById("loginPage").style.display="none"
document.getElementById("gamePage").style.display="block"

}

function bet(board,item){

if(points<50){
alert("คะแนนไม่พอ")
return
}

points-=50
document.getElementById("points").innerText=points

let message=playerName+" ลง '"+item+"' ที่ บอร์ด "+board

let log=document.getElementById("log")
log.innerHTML="<p>"+message+"</p>"+log.innerHTML

}

function rollDice(){

let d1=document.getElementById("dice1")
let d2=document.getElementById("dice2")
let d3=document.getElementById("dice3")

// แสดงลูกเต๋า
d1.innerText="🎲"
d2.innerText="🎲"
d3.innerText="🎲"

// เริ่มหมุน
d1.classList.add("roll")
d2.classList.add("roll")
d3.classList.add("roll")

setTimeout(()=>{

let r1=items[Math.floor(Math.random()*items.length)]
let r2=items[Math.floor(Math.random()*items.length)]
let r3=items[Math.floor(Math.random()*items.length)]

// หยุดหมุน
d1.classList.remove("roll")
d2.classList.remove("roll")
d3.classList.remove("roll")

// เปิดหน้าเต๋า
d1.innerText=r1.icon
d2.innerText=r2.icon
d3.innerText=r3.icon

document.getElementById("diceResult").innerText=
"ผลออก: "+r1.name+" "+r2.name+" "+r3.name

},2000)

}

</script>

</body>
</html>
