<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Months with Bibie ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&family=Prompt:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bibie-pink: #ffdae0;
            --heart-red: #ff5e78;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background: #fff5f6;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        #bg-hearts {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 15px 40px rgba(255, 150, 170, 0.2);
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #fff;
            margin-top: 20px;
        }

        .day-counter {
            background: var(--bibie-pink);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .day-counter span {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--heart-red);
            font-family: 'Mali';
        }

        .photo-frame {
            position: relative;
            margin: 20px 0;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .main-img {
            width: 100%;
            height: auto;
            border-radius: 25px;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-surprise {
            background: linear-gradient(45deg, #ff5e78, #ff8a9a);
            color: white;
            border: none;
            padding: 18px 0;
            width: 100%;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 94, 120, 0.3);
            margin-top: 20px;
        }

        #hidden-content {
            display: none;
            margin-top: 25px;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .audio-container {
            margin-top: 20px;
            padding: 10px;
            background: #fdf2f4;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <canvas id="bg-hearts"></canvas>

    <div class="container">
        <div class="main-card">
            <h1 style="font-family: 'Mali'; color: var(--heart-red); margin-bottom: 10px;">บิบี๋...เราคบกันมา</h1>
            
            <div class="day-counter">
                <span id="days-count">0</span>
                <p style="margin: 0; font-size: 0.9rem;">วันแล้วนะ ❤️</p>
            </div>

            <div class="photo-frame">
                <img src="image/Pie.png" alt="Bibie" class="main-img">
            </div>

            <p style="font-size: 1.1rem;">"3 เดือนที่แสนพิเศษ"</p>

            <button class="btn-surprise" id="btn-start" onclick="celebrate()">กดเพื่อฟังเพลงและเซอร์ไพรส์ ✨</button>

            <div id="hidden-content">
                <div class="audio-container">
                    <p style="font-size: 0.8rem; margin-bottom: 5px;">🎵 รักให้เธอได้รู้ - PUN</p>
                    <audio id="love-song" controls style="width: 100%;">
                        <!-- ใส่ไฟล์เพลงที่นี่ (ถ้าไม่มีไฟล์ให้ใช้ลิงก์จากโฮสต์ของคุณ) -->
                        <source src="pun.mp3" type="audio/mpeg">
                    </audio>
                </div>
                <p style="font-family: 'Mali'; font-size: 1.2rem; line-height: 1.8; margin-top: 20px;">
                    "ขอบคุณที่เป็นความรักที่ดี <br>
                    เค้าจะรักบิบี๋ให้มากกว่าเมื่อวานในทุกวันนะ"
                </p>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ระบบนับวันคบกัน ---
        // ปรับวันที่คบกันที่นี่ (ปี, เดือน-1, วัน)
        // เดือนใน JS เริ่มจาก 0 (มกรา=0, กุมภา=1, มีนา=2)
        const startDate = new Date(2026, 1, 1); // สมมติว่าคบกัน 1 ก.พ. 2026
        
        function updateDays() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('days-count').innerText = days;
        }
        updateDays();

        // --- 2. ระบบเซอร์ไพรส์ ---
        function celebrate() {
            const song = document.getElementById('love-song');
            song.play(); // เริ่มเล่นเพลง

            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff5e78', '#ffdae0', '#ffffff']
            });

            document.getElementById('hidden-content').style.display = 'block';
            document.getElementById('btn-start').innerText = "รักบิบี๋ที่สุด!";
        }

        // --- 3. หัวใจลอยพื้นหลัง ---
        const canvas = document.getElementById('bg-hearts');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 15 + 5;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -10) this.y = canvas.height + 10;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 94, 120, ${this.opacity})`;
                ctx.font = `${this.size}px serif`;
                ctx.fillText('❤️', this.x, this.y);
            }
        }

        for (let i = 0; i < 15; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
