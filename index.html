<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:sans-serif;
background:#fff0f6;
overflow:hidden;
}

h1{
color:#ff6fa5;
}

input{
padding:10px;
border-radius:10px;
border:1px solid #ff9fc5;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#ff7eb3;
color:white;
cursor:pointer;
}

#letter{
display:none;
text-align:center;
max-width:500px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.sticker{
position:absolute;
font-size:30px;
animation:float 6s infinite linear;
opacity:0.8;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}

</style>
</head>

<body>

<h1>🔒 ใส่รหัสก่อนนะ</h1>

<input type="password" id="pass">
<br><br>
<button onclick="check()">เข้าเว็บ</button>

<div id="letter">
<h2>ถึงคนเก่งของผม 💖</h2>

<p>
ผมอยากให้รู้ไว้นะว่า  
ไม่ว่าที่รักจะเหนื่อยแค่ไหน  
ผมจะอยู่ข้างๆเสมอ 🌸
</p>

<p>
ที่รักเก่งมากแล้วจริงๆ  
อย่าลืมภูมิใจในตัวเองนะ
</p>

<p>
พักบ้าง ยิ้มบ้าง  
แล้วค่อยเดินต่อไปนะคะคนเก่งของผม ✨
</p>

<p>
รักที่รักเสมอ 💕
</p>

</div>

<script>

const password = "iloveyou"

function check(){

let input = document.getElementById("pass").value

if(input === password){

document.querySelector("h1").style.display="none"
document.querySelector("input").style.display="none"
document.querySelector("button").style.display="none"

document.getElementById("letter").style.display="block"

createStickers()

}else{

alert("รหัสไม่ถูกนะ")

}

}

function createStickers(){

const stickers = ["🐻","🐰","🌸","💖","✨","🧸","🌷","💗","🌼","⭐"]

setInterval(()=>{

let s = document.createElement("div")
s.className="sticker"

s.innerHTML = stickers[Math.floor(Math.random()*stickers.length)]

s.style.left = Math.random()*100 + "vw"

s.style.fontSize = (20 + Math.random()*30) + "px"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},6000)

},400)

}

</script>

</body>
</html>
